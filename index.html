<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#1b426b"/>
<meta name="description" content="Un quiz interactif pour réviser les dates des Temps modernes en première année de gymnase."/><title>Quiz d'histoire — Les Temps modernes</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#162940;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 14px 48px}
main{max-width:750px;margin:auto}header{text-align:center;margin:9px 0 27px}header small{letter-spacing:.13em;color:#5c7290;font-weight:800;font-size:.78rem;text-transform:uppercase}h1{margin:11px 0 5px;font-size:clamp(1.7rem,6vw,2.7rem)}header p{color:#63768a;margin:5px}
.card{background:#fff;border:1px solid #dee5ee;box-shadow:0 9px 30px #1b426b0b;padding:clamp(16px,5vw,34px);border-radius:20px}.config{display:grid;grid-template-columns:1fr 1fr;gap:14px}.config label{display:block;font-weight:750;margin-bottom:7px}.config select{width:100%;font:inherit;padding:12px;border-radius:10px;border:1px solid #b7c9db;color:#162940;background:white}
.progressline{display:flex;justify-content:space-between;gap:10px;font-size:.92rem;color:#617891;font-weight:650;margin:24px 0 10px}progress{width:100%;height:9px;accent-color:#295f8e}
.question{text-align:center;padding:28px 6px 25px}.eyebrow{font-size:.8rem;color:#547ba0;letter-spacing:.12em;font-weight:850}.prompt{font-size:clamp(1.4rem,4.7vw,2rem);font-weight:800;line-height:1.35;margin:14px 0;overflow-wrap:anywhere}.options{display:grid;gap:10px}.option{border:1.5px solid #c2d1e2;border-radius:12px;background:white;text-align:left;min-height:56px;padding:13px 15px;display:flex;gap:11px;align-items:center;color:#1c3855;font:inherit;cursor:pointer}.option:hover:not(:disabled){border-color:#376ea1;background:#f1f7fc}.option:disabled{cursor:default;color:#1c3855}.letter{flex:none;border-radius:8px;background:#e7eef5;min-width:29px;height:29px;display:flex;align-items:center;justify-content:center;font-size:.88rem;font-weight:750}.option.correct{border-color:#33885c;background:#e9f8ee}.option.wrong{border-color:#b94a52;background:#ffefef}.message{padding:14px 16px;margin-top:15px;border-radius:11px;background:#edf2f7;line-height:1.5}.message.correct{background:#e9f8ee}.message.wrong{background:#ffefef}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button.primary,button.secondary{padding:13px 19px;border:0;border-radius:12px;font:inherit;font-weight:800;cursor:pointer}button.primary{background:#194b7b;color:white}button.secondary{background:#e8eff7;color:#194b7b}button.primary:hover{background:#123b64}.hidden{display:none!important}.final-score{font-size:3.4rem;font-weight:850;text-align:center;padding-top:20px}.review li{margin:14px 0;line-height:1.5}.review h3{margin-top:28px}footer{text-align:center;color:#718298;font-size:.86rem;margin-top:22px}
button:focus-visible,select:focus-visible{outline:3px solid #ffb14b;outline-offset:2px}@media(max-width:540px){.config{grid-template-columns:1fr}.buttons button{width:100%}}
</style></head><body><main><header><small>Histoire • 1re année de gymnase</small><h1>Les Temps modernes</h1><p>Quiz interactif sur 35 événements historiques</p></header>
<section class="card"><div class="config"><div><label for="mode">Type de questions</label><select id="mode"><option value="event">Événement → date</option><option value="date">Date → événement</option></select></div><div><label for="amount">Nombre de questions</label><select id="amount"><option value="10">10 questions</option><option value="20">20 questions</option><option value="all">Toutes les questions</option></select></div></div>
<div id="quiz"><div class="progressline"><span id="number"></span><span id="score"></span></div><progress id="bar" max="10" value="0"></progress><div class="question"><div class="eyebrow" id="hint"></div><div class="prompt" id="prompt"></div></div><div class="options" id="options"></div><div id="feedback" class="message hidden" aria-live="polite"></div><div class="buttons"><button id="next" class="primary hidden">Question suivante →</button><button id="reset" class="secondary">Recommencer</button></div></div>
<div id="end" class="hidden"><div id="finalscore" class="final-score"></div><h2 id="endtitle" style="text-align:center"></h2><p id="percent" style="text-align:center;color:#617891"></p><div id="review" class="review"></div><div class="buttons"><button id="again" class="primary">Nouveau quiz</button><button id="switch" class="secondary">Tester dans l’autre sens</button></div></div>
</section><footer>Sans compte · Sans publicité · Les réponses restent dans ton navigateur</footer></main>
<script>
'use strict';const facts=[{"date": "1453–1789", "event": "Les Temps modernes."}, {"date": "1487", "event": "Bartholomeu Diaz franchit le cap de Bonne-Espérance."}, {"date": "1492", "event": "Christophe Colomb découvre l’Amérique."}, {"date": "1492", "event": "Fin de la Reconquista espagnole : Grenade est reprise aux musulmans."}, {"date": "1498", "event": "Vasco de Gama parvient aux Indes."}, {"date": "1499–1500", "event": "Álvares Cabral découvre le Brésil."}, {"date": "1509–1512", "event": "Michel-Ange peint la voûte de la chapelle Sixtine."}, {"date": "1515", "event": "Bataille de Marignan, gagnée par François Ier contre les Confédérés. Début traditionnel de la neutralité suisse."}, {"date": "1517", "event": "Luther publie ses 95 thèses contre les indulgences. Début de la Réforme."}, {"date": "1519–1521", "event": "Expédition de Magellan, tué aux Philippines. Sa flotte accomplit le premier tour du monde, achevé en 1522."}, {"date": "1534", "event": "Le roi d’Angleterre rompt avec le pape et fonde l’Église anglicane."}, {"date": "1536", "event": "Calvin s’établit à Genève."}, {"date": "1536", "event": "Les Bernois conquièrent le pays de Vaud."}, {"date": "1572", "event": "Massacre de la Saint-Barthélemy."}, {"date": "1598", "event": "Henri IV promulgue l’édit de Nantes, autorisant le protestantisme sous certaines conditions."}, {"date": "XVIIe siècle", "event": "Développement du commerce triangulaire."}, {"date": "1602", "event": "Échec de l’attaque de Genève par les Savoyards. Origine de la fête de l’Escalade."}, {"date": "1614", "event": "Révolte des grands seigneurs contre Marie de Médicis. Les États généraux ne ramènent pas le calme."}, {"date": "1618–1648", "event": "Guerre de Trente Ans en Europe."}, {"date": "1633", "event": "Galilée est condamné pour hérésie."}, {"date": "1642", "event": "Le cardinal Mazarin succède à Richelieu."}, {"date": "1648–1652", "event": "La Fronde : révolte contre la royauté française."}, {"date": "1661", "event": "Début du règne personnel de Louis XIV."}, {"date": "1670", "event": "Molière écrit Le Bourgeois gentilhomme."}, {"date": "1679", "event": "Habeas Corpus en Angleterre : protection contre les détentions arbitraires."}, {"date": "1682", "event": "Louis XIV installe sa cour à Versailles."}, {"date": "1685", "event": "Louis XIV révoque l’édit de Nantes."}, {"date": "1688", "event": "Glorieuse Révolution en Angleterre, une étape vers la monarchie constitutionnelle."}, {"date": "XVIIIe siècle", "event": "Le siècle des Lumières."}, {"date": "1715", "event": "Mort de Louis XIV. Philippe d’Orléans assure la régence."}, {"date": "1723", "event": "Exécution du major Davel à Vidy après sa tentative de soulever le pays de Vaud contre les Bernois."}, {"date": "1751", "event": "Début de la publication de l’Encyclopédie, notamment sous l’impulsion de Diderot."}, {"date": "1756–1763", "event": "Guerre de Sept Ans : la France perd une grande partie de ses colonies d’Amérique du Nord."}, {"date": "1769", "event": "James Watt perfectionne la machine à vapeur ; essor de la révolution industrielle en Angleterre."}, {"date": "1775–1783", "event": "Révolution américaine et guerre d’indépendance des États-Unis."}];
const $=id=>document.getElementById(id);let bank=[],questions=[],index=0,score=0,answered=false,mistakes=[];
function shuffle(items){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]];}return out;}
function source(){if($('mode').value==='event')return facts;const group=new Map();for(const f of facts){group.set(f.date,group.has(f.date)?group.get(f.date)+' / '+f.event:f.event);}return [...group].map(([date,event])=>({date,event}));}
function start(){bank=source();const n=$('amount').value==='all'?bank.length:Math.min(+$('amount').value,bank.length);questions=shuffle(bank).slice(0,n);index=0;score=0;mistakes=[];$('quiz').classList.remove('hidden');$('end').classList.add('hidden');render();}
function target(f){return $('mode').value==='event'?f.date:f.event;}
function options(q){const key=$('mode').value==='event'?'date':'event';const year=v=>{const n=parseInt(v.date,10);return Number.isFinite(n)?n:v.date.startsWith('XVIII')?1750:1650;};const pool=[...bank].filter(f=>f[key]!==q[key]).sort((a,b)=>Math.abs(year(a)-year(q))-Math.abs(year(b)-year(q)));return shuffle([q[key],...[...new Set(pool.map(f=>f[key]))].slice(0,3)]);}
function render(){const q=questions[index];answered=false;$('number').textContent=`Question ${index+1} / ${questions.length}`;$('score').textContent=`Score : ${score} / ${index}`;$('bar').max=questions.length;$('bar').value=index;$('hint').textContent=$('mode').value==='event'?'EN QUELLE ANNÉE ?':'QUE S’EST-IL PASSÉ ?';$('prompt').textContent=$('mode').value==='event'?q.event:q.date;$('feedback').className='message hidden';$('next').classList.add('hidden');$('options').replaceChildren();for(const [i,v] of options(q).entries()){const b=document.createElement('button');b.className='option';b.type='button';const tag=document.createElement('span');tag.className='letter';tag.textContent='ABCD'[i];const text=document.createElement('span');text.textContent=v;b.append(tag,text);b.addEventListener('click',()=>pick(v,q));$('options').append(b);}}
function pick(v,q){if(answered)return;answered=true;const t=target(q),ok=v===t;if(ok)score++;else mistakes.push({prompt:$('mode').value==='event'?q.event:q.date,answer:t});for(const b of $('options').children){const current=b.lastChild.textContent;b.disabled=true;if(current===t)b.classList.add('correct');else if(current===v)b.classList.add('wrong');}$('feedback').className='message '+(ok?'correct':'wrong');$('feedback').textContent=ok?'✓ Bonne réponse !':'✕ La bonne réponse est : '+t;$('score').textContent=`Score : ${score} / ${index+1}`;$('next').textContent=index===questions.length-1?'Voir le résultat →':'Question suivante →';$('next').classList.remove('hidden');}
function finish(){$('quiz').classList.add('hidden');$('end').classList.remove('hidden');let p=Math.round(score/questions.length*100);$('finalscore').textContent=`${score} / ${questions.length}`;$('endtitle').textContent=p===100?'Excellent, sans faute !':p>=80?'Très bon résultat !':p>=60?'Bonne progression !':'Encore un peu d’entraînement !';$('percent').textContent=p+' % de bonnes réponses';$('review').replaceChildren();if(mistakes.length){const h=document.createElement('h3');h.textContent='Questions à revoir ('+mistakes.length+')';const ol=document.createElement('ol');for(const m of mistakes){const li=document.createElement('li');li.textContent=m.prompt+' — Bonne réponse : '+m.answer;ol.append(li);}$('review').append(h,ol);}}
$('next').addEventListener('click',()=>{index++;if(index===questions.length)finish();else render()});$('reset').addEventListener('click',start);$('again').addEventListener('click',start);$('switch').addEventListener('click',()=>{$('mode').value=$('mode').value==='event'?'date':'event';start();});$('mode').addEventListener('change',start);$('amount').addEventListener('change',start);start();
</script></body></html>
